# 10 runs in ~16 h on 8 cores: ~50 min per run measured, so about 2x headroom.
# Run: make train-batch RUNS=10 BATCH=sbgp-16h GP_ARGS=--config=batch-16h.properties
populationSize=100
generations=200
# EightBasesWorkers16x16 made each evaluation ~4x slower (Rojo and mayari on many units), so it is a holdout map here
maps=maps/8x8/basesWorkersBarracks8x8.xml,maps/8x8/basesWorkers8x8A.xml,maps/8x8/basesWorkers8x8Obstacle.xml,maps/12x12/basesWorkers12x12.xml,maps/12x12/SixBasesWorkers12x12.xml,maps/12x12/basesWorkers12x12F.xml,maps/16x16/melee16x16Mixed12.xml,maps/16x16/TwoBasesBarracks16x16.xml
holdoutMaps=maps/10x10/basesWorkers10x10.xml,maps/12x12/basesWorkers12x12A.xml,maps/24x24/basesWorkers24x24.xml,maps/16x16/EightBasesWorkers16x16.xml
