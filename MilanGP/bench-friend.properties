# Mirrors the friend's bench: 8 maps x {CoacAI, mayari}, 5 samples per map-side, 4000-cycle cap.
# Run: make holdout PLAY_ARGS="--config=bench-friend.properties --playBotFile=models/best_v3.txt"
# These are also the GPConfig training defaults, so this scores the training set, not unseen play.
holdoutMaps=maps/8x8/basesWorkers8x8B.xml,maps/8x8/basesWorkers8x8D.xml,maps/8x8/basesWorkers8x8F.xml,maps/8x8/basesWorkers8x8G.xml,maps/8x8/basesWorkers8x8K.xml,maps/16x16/basesWorkers16x16.xml,maps/16x16/basesWorkers16x16C.xml,maps/16x16/basesWorkers16x16E.xml
holdoutOpponents=Coacai,mayariBot
# GPPlay ignores the training lists, but validate() requires them disjoint from the holdout lists
maps=maps/8x8/basesWorkers8x8A.xml
opponents=WorkerRush
playIterations=5
maxCycles=4000
# no inactivity cutoff: games run to a win or the cycle cap
maxInactiveCycles=4000
